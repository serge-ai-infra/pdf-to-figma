name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Python package
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[compare,dev]"

      - name: Install Node packages
        run: |
          npm ci --prefix emitter
          npm ci --prefix figma-plugin

      # The same script a developer runs locally: pytest, ruff, mypy --strict,
      # the emitter's tests and the plugin's typecheck.
      - name: Regression checks
        run: ./scripts/verify-regression.sh

      # The committed demo PDF through every stage that doesn't need Figma,
      # checked against the demo's known counts (see the script header).
      - name: Demo smoke run
        run: ./scripts/smoke-demo.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan every commit, not just the tip

      # The binary, not gitleaks-action: the action needs a license key for
      # organization-owned repositories.
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks

      - name: Scan full history
        run: ./gitleaks detect --source . --redact --verbose
